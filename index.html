<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- viewport-fit=cover is the actual switch that turns on the Dynamic
         Island / notch / home-indicator safe area — every env(safe-area-
         inset-*) used across style.css (mobile headers, tab bar, FAB)
         silently resolves to 0px without this, on both iOS Safari and the
         Capacitor Android WebView. Without it, the page never opts into
         drawing under those regions in the first place, so there's no
         "unsafe" area for the browser to report insets against. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Vibe Composer</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Tone.js audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
